openapi: 3.2.0
info:
  title: IPFS RPC Commands API
  version: v0
  description: When a Kubo IPFS node is running as a daemon, it exposes an HTTP RPC API that allows you to control the node and run the same commands you can from the command line.
  x-providerName: IPFS
  x-logo:
    url: https://raw.githubusercontent.com/ipfs/ipfs-docs/55fe8bc6a53ba3b9023951fb4b432efbbc81fba5/docs/.vuepress/public/images/ipfs-logo.svg
servers:
- description: Local IPFS node
  url: http://localhost:5001
- description: Local IPFS node
  url: http://127.0.0.1:5001
- description: Infura hosted IPFS node
  url: https://ipfs.infura.io:5001
tags:
- name: Commands
paths:
  /api/v0/commands:
    post:
      operationId: commands
      description: List all available commands.
      externalDocs:
        url: https://docs.ipfs.tech/reference/kubo/rpc/#api-v0-commands
      parameters:
      - name: flags
        in: query
        description: Show command flags.
        schema:
          type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                Name: <string>
                Options:
                - Names:
                  - <string>
                Subcommands:
                - Name: <string>
                  Options:
                  - Names:
                    - <string>
                  Subcommands:
                  - '...'
      tags:
      - Commands
      summary: Commands
      x-summary-source: derived
externalDocs:
  url: https://docs.ipfs.tech/reference/kubo/rpc/
