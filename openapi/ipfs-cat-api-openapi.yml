openapi: 3.2.0
info:
  title: IPFS RPC Cat API
  version: v0
  description: When a Kubo IPFS node is running as a daemon, it exposes an HTTP RPC API that allows you to control the node and run the same commands you can from the command line.
  x-providerName: IPFS
  x-logo:
    url: https://raw.githubusercontent.com/ipfs/ipfs-docs/55fe8bc6a53ba3b9023951fb4b432efbbc81fba5/docs/.vuepress/public/images/ipfs-logo.svg
servers:
- description: Local IPFS node
  url: http://localhost:5001
- description: Local IPFS node
  url: http://127.0.0.1:5001
- description: Infura hosted IPFS node
  url: https://ipfs.infura.io:5001
tags:
- name: Cat
paths:
  /api/v0/cat:
    post:
      operationId: cat
      description: Show IPFS object data.
      externalDocs:
        url: https://docs.ipfs.tech/reference/kubo/rpc/#api-v0-cat
      parameters:
      - name: arg
        in: query
        description: The path to the IPFS object(s) to be outputted.
        required: true
        schema:
          type: string
      - name: offset
        in: query
        description: Byte offset to begin reading from.
        schema:
          type: integer
      - name: length
        in: query
        description: Maximum number of bytes to read.
        schema:
          type: integer
      - name: progress
        in: query
        description: Stream progress data.
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Successful response
      tags:
      - Cat
      summary: Cat
      x-summary-source: derived
externalDocs:
  url: https://docs.ipfs.tech/reference/kubo/rpc/
